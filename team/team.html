<main class="team-page">
<div class="container">
<!-- HERO -->
<section class="team-hero">
<div class="hero-grid">
<div>
<span class="eyebrow" id="heroEyebrow"></span>
<h1 id="heroTitle"></h1>
<p class="lead" id="heroLead"></p>
</div>
<div>
<div class="hero-media">
<img alt="Auto_Lab Team" id="heroImage"/>
</div>
<div class="hero-caption">
<b id="heroCaptionBold"></b> <span id="heroCaption"></span>
</div>
</div>
</div>
</section>
<!-- ACHIEVEMENTS -->
<section class="team-block">
<div class="block-head">
<h2>Achievements</h2>
<p data-i18n="team_team.text.0">팀의 주요 개발 마일스톤과 시즌 성과를 정리합니다.</p>
</div>
<div class="timeline" id="timeline"></div>
</section>
<!-- MEMBERS (BOTTOM) -->
<section class="team-block">
<div class="block-head">
<h2>Members</h2>
<p data-i18n="team_team.autolab.1">Auto_Lab을 구성하는 팀원들입니다.</p>
</div>

<div class="member-tools">
  <div class="member-tabs" role="tablist" aria-label="EV/CV filter">
    <button type="button" class="tab active" id="tabAll" data-team="ALL" role="tab" aria-selected="true">All</button>
    <button type="button" class="tab" id="tabEV" data-team="EV" role="tab" aria-selected="false">EV</button>
    <button type="button" class="tab" id="tabCV" data-team="CV" role="tab" aria-selected="false">CV</button>
  </div>

  <select id="memberDivision">
    <option value="ALL">All Divisions</option>
  </select>

  <input id="memberSearch" placeholder="Search name or role" type="search"/>
</div>

<div class="member-grid" id="memberGrid"></div>
<div id="memberPagination" class="member-pagination" aria-label="Members pagination"></div>

</section>
</div>

<script src="main/script.js"></script>
